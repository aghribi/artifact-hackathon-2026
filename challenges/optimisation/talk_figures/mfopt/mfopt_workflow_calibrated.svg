<svg viewBox="0 0 700 1100" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:Helvetica,Arial,sans-serif;fill:#2C2C2A}.t{font-size:14px}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:1}.c-purple>text.th{fill:#534AB7}.c-blue>rect{fill:#E6F1FB;stroke:#185FA5;stroke-width:1}.c-blue>text.th{fill:#185FA5}.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1}.c-teal>text.th{fill:#0F6E56}.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}.c-gray>text.th{fill:#5F5E5A}.c-amber>rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:1}.c-amber>text.th{fill:#854F0B}.c-green>rect{fill:#EAF3DE;stroke:#3B6D11;stroke-width:1}.c-green>text.th{fill:#3B6D11}</style><rect width='100%' height='100%' fill='#FFFFFF'/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker></defs><g class="c-gray"><rect x="150" y="10" width="400" height="58" rx="8"/><text class="th" x="350" y="33" text-anchor="middle">reset(seed): a new day, one free reading</text><text class="ts" x="350" y="53" text-anchor="middle">hidden beam + misalignments; we see BPMs, FEH-SCR-01, target (mu, sigma)</text></g><line class="arr" x1="350" y1="68" x2="350" y2="88" marker-end="url(#ah)"/><g class="c-purple"><rect x="80" y="90" width="540" height="94" rx="8"/><text class="th" x="350" y="112" text-anchor="middle">Model, free: calibrate the day's beam, re-match, aim</text><text class="ts" x="350" y="132" text-anchor="middle">MAP fit of 7 numbers (size, mismatch per plane, energy spread, extra size</text><text class="ts" x="350" y="150" text-anchor="middle">per plane) to the reset reading; re-match FEA Q15/16, FEH Q1/2 for that beam;</text><text class="ts" x="350" y="168" text-anchor="middle">FEH HVCOR 01/02 aimed at the requested centroid from the response table</text></g><line class="arr" x1="350" y1="184" x2="350" y2="204" marker-end="url(#ah)"/><g class="c-blue"><rect x="150" y="206" width="400" height="44" rx="8"/><text class="th" x="350" y="233" text-anchor="middle">Step 1: load the optics, correctors already aimed</text></g><line class="arr" x1="350" y1="250" x2="350" y2="270" marker-end="url(#ah)"/><g class="c-blue"><rect x="100" y="272" width="500" height="76" rx="8"/><text class="th" x="350" y="294" text-anchor="middle">Linear steering: thread if lost, then 2 SVD orbit shots</text><text class="ts" x="350" y="314" text-anchor="middle">R cropped to the BPMs that read; orbit onto the twin's orbit;</text><text class="ts" x="350" y="332" text-anchor="middle">every reading of the spot also refits the beam</text></g><line class="arr" x1="350" y1="348" x2="350" y2="368" marker-end="url(#ah)"/><g class="c-blue"><rect x="100" y="370" width="500" height="76" rx="8"/><text class="th" x="350" y="392" text-anchor="middle">Calibrated shots, while the predicted gain beats a step</text><text class="ts" x="350" y="412" text-anchor="middle">refit the beam, re-match the final focus if worth it,</text><text class="ts" x="350" y="430" text-anchor="middle">re-aim FEH correctors on the measured centroid (linear)</text></g><line class="arr" x1="350" y1="446" x2="350" y2="466" marker-end="url(#ah)"/><g class="c-purple"><rect x="100" y="468" width="500" height="76" rx="8"/><text class="th" x="350" y="490" text-anchor="middle">MF-BO low fidelity, free: the calibrated twin</text><text class="ts" x="350" y="510" text-anchor="middle">256 Sobol points over 7 knobs (FEA Q14/15/16, FEH Q1/2, 2 sextupoles),</text><text class="ts" x="350" y="528" text-anchor="middle">one batched Cheetah track; one GP per readout (mu_x, mu_y, sig_x, sig_y, T)</text></g><line class="arr" x1="350" y1="544" x2="350" y2="564" marker-end="url(#ah)"/><g class="c-teal"><rect x="60" y="566" width="580" height="250" rx="10"/><text class="th" x="80" y="590">MF-BO loop on the machine (one step per shot)</text></g><g class="c-gray"><rect x="90" y="604" width="520" height="40" rx="6"/><text class="t" x="350" y="629" text-anchor="middle">machine = calibrated-model GP + discrepancy (offset, then a GP)</text></g><line class="arr" x1="350" y1="644" x2="350" y2="658" marker-end="url(#ah)"/><g class="c-gray"><rect x="90" y="660" width="520" height="40" rx="6"/><text class="t" x="350" y="685" text-anchor="middle">propose x: max expected improvement of the benchmark mismatch</text></g><line class="arr" x1="350" y1="700" x2="350" y2="714" marker-end="url(#ah)"/><g class="c-gray"><rect x="90" y="716" width="520" height="40" rx="6"/><text class="t" x="350" y="741" text-anchor="middle">set x + FEH correctors cancelling the predicted centroid; read</text></g><line class="arr" x1="350" y1="756" x2="350" y2="770" marker-end="url(#ah)"/><g class="c-amber"><rect x="150" y="772" width="400" height="34" rx="6"/><text class="t" x="350" y="794" text-anchor="middle">EI below the cost of one more step, or no budget?</text></g><path class="arr" d="M150 789 L72 789 L72 624 L88 624" marker-end="url(#ah)"/><text class="ts" x="78" y="781">no</text><line class="arr" x1="350" y1="806" x2="350" y2="836" marker-end="url(#ah)"/><text class="ts" x="358" y="826">yes</text><g class="c-blue"><rect x="150" y="838" width="400" height="58" rx="8"/><text class="th" x="350" y="860" text-anchor="middle">Return to the best reading</text><text class="ts" x="350" y="880" text-anchor="middle">re-set its magnets if it was not the last shot (one step)</text></g><line class="arr" x1="350" y1="896" x2="350" y2="916" marker-end="url(#ah)"/><g class="c-green"><rect x="100" y="918" width="500" height="60" rx="8"/><text class="th" x="350" y="941" text-anchor="middle">Score: last reading of FEH-SCR-01</text><text class="ts" x="350" y="961" text-anchor="middle">mismatch in spot sizes + 2 (1 - T), capped at 10, + 0.5 log2(1 + steps/50)</text></g><g class="c-purple"><rect x="110" y="1002" width="16" height="14" rx="3"/></g><text class="ts" x="134" y="1014">model only, costs no step</text><g class="c-blue"><rect x="320" y="1002" width="16" height="14" rx="3"/></g><text class="ts" x="344" y="1014">machine shots, each costs a step (max 50)</text></svg>
